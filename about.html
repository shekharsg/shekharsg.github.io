      background: linear-gradient(to right, #005c88, #0077aa);

<body>
  <header>
    <h1>Dr. Shekhar Sharan Goyal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>

      <a href="science_outreach.html">Science Outreach</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Collaborative Network</h2>
      <div id="network"></div>
    </section>

    <script type="text/javascript">
      function drawNetwork() {
        const nodes = new vis.DataSet([
          { id: 1, label: "Shekhar Sharan Goyal", color: "#f39c12", shape: "circularImage", 
            image: "https://upload.wikimedia.org/wikipedia/commons/9/99/Sample_User_Icon.png", 
            size: 50, font: { size: 24, color: "#333", bold: true } },
          { id: 2, label: "Rohini Kumar", color: "#e74c3c", size: 30 },
          { id: 3, label: "Raviraj Dave", color: "#3498db", size: 30 },
          { id: 4, label: "Masooma Batool", color: "#2ecc71", size: 30 },
          { id: 5, label: "Adrija Datta", color: "#9b59b6", size: 30 },
          { id: 6, label: "Udit Bhatia", color: "#1abc9c", size: 30 },
          { id: 7, label: "Christian Schmidt", color: "#f1c40f", size: 30 },
          { id: 8, label: "Wim de Vries", color: "#e67e22", size: 30 },
          { id: 9, label: "Karsten Rinke", color: "#34495e", size: 30 },
          { id: 10, label: "Divya Upadhyay", color: "#d35400", size: 30 },
          { id: 11, label: "Subimal Ghosh", color: "#8e44ad", size: 30 }
        ]);

        const edges = new vis.DataSet([
          { from: 1, to: 2 },
          { from: 1, to: 3 },
          { from: 1, to: 4 },
          { from: 1, to: 5 },
          { from: 1, to: 6 },
          { from: 1, to: 7 },
          { from: 1, to: 8 },
          { from: 1, to: 9 },
          { from: 1, to: 10 },
          { from: 1, to: 11 }
        ]);

        const container = document.getElementById('network');
        const data = { nodes: nodes, edges: edges };
        const options = {
          layout: {
            randomSeed: 2, // Try changing this if you want different spread
            improvedLayout: true
          },
          nodes: {
            borderWidth: 2,
            shadow: true
          },
          edges: {
            color: { color: '#aaa' },
            arrows: {
              to: { enabled: false }
            },
            smooth: {
              type: 'dynamic'
            }
          },
          physics: {
            enabled: true,
            barnesHut: {
              gravitationalConstant: -30000,
              centralGravity: 0.1,
              springLength: 200,
              springConstant: 0.05,
              damping: 0.09
            },
            stabilization: {
              iterations: 2500
            }
          },
          interaction: {
            hover: true,
            tooltipDelay: 200
          }
        };

        const network = new vis.Network(container, data, options);

        // Open Google Scholar on click
        network.on("click", function (params) {
          if (params.nodes.length === 1 && params.nodes[0] === 1) {
            window.open('https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID', '_blank');
          }
        });
      }

      drawNetwork();
    </script>
  </main>

  <footer>
    <p style="text-align: center;">&copy; 2025 Shekhar Sharan Goyal</p>
  </footer>
</body>
</html>
