<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collaboration Network | Shekhar Sharan Goyal</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: linear-gradient(to right, #003366, #005c99);
      color: white;
      padding: 2rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    #network {
      width: 90%;
      height: 700px;
      margin: 40px auto;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: white;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      background: #f0f0f0;
      color: #555;
    }
  </style>
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
</head>

<body>
  <header>
    <h1>Collaboration Network</h1>
  </header>

  <div id="network"></div>

  <footer>
    &copy; 2025 Shekhar Sharan Goyal
  </footer>

  <script>
    function drawNetwork() {
      const nodes = new vis.DataSet([
        { id: 1, label: "Shekhar Sharan Goyal", shape: "circle",
          color: { background: "#005c99", border: "#003366", highlight: { background: "#007acc", border: "#005c99" } },
          font: { color: "#ffffff", size: 22, bold: true }, size: 25
        },
        { id: 2, label: "Rohini Kumar", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 3, label: "Raviraj Dave", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 4, label: "Masooma Batool", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 5, label: "Adrija Datta", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 6, label: "Udit Bhatia", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 7, label: "Christian Schmidt", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 8, label: "Wim de Vries", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 9, label: "Karsten Rinke", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 10, label: "Divya Upadhyay", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
        { id: 11, label: "Subimal Ghosh", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },
                { id: 12, label: "Shaonli", color: { background: "#dddddd", border: "#bbbbbb" }, font: { size: 18 } },

      ]);

      const edges = new vis.DataSet([
        { from: 1, to: 2 }, { from: 1, to: 3 }, { from: 1, to: 4 }, { from: 1, to: 5 },
        { from: 1, to: 6 }, { from: 1, to: 7 }, { from: 1, to: 8 }, { from: 1, to: 9 },
        { from: 1, to: 10 }, { from: 1, to: 11 },{ from: 1, to: 12 },{ from: 6, to: 11 },{ from: 10, to: 11 },
        { from: 2, to: 3 }, { from: 2, to: 6 }, { from: 3, to: 6 },
        { from: 4, to: 3 }, { from: 4, to: 8 }, { from: 5, to: 6 },
        { from: 7, to: 2 }, { from: 8, to: 2 }, { from: 9, to: 2 },
        { from: 10, to: 6 },{ from: 12, to: 6 }
      ]);

      const container = document.getElementById('network');
      const data = { nodes: nodes, edges: edges };
      const options = {
        layout: {
          randomSeed: 15,
          improvedLayout: true
        },
        nodes: {
          borderWidth: 1,
          shadow: {
            enabled: true,
            color: 'rgba(0,0,0,0.1)',
            size: 10,
            x: 5,
            y: 5
          },
          scaling: {
            min: 10,
            max: 40
          }
        },
        edges: {
          color: {
            color: "#cccccc",
            highlight: "#007acc",
            hover: "#007acc"
          },
          width: 2,
          smooth: {
            type: "dynamic"
          }
        },
        physics: {
          solver: "forceAtlas2Based",
          forceAtlas2Based: {
            gravitationalConstant: -50,
            centralGravity: 0.01,
            springLength: 150,
            springConstant: 0.05,
            damping: 0.4
          },
          stabilization: {
            iterations: 150
          }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          navigationButtons: true,
          keyboard: true
        }
      };

      const network = new vis.Network(container, data, options);

      // Click to open Google Scholar
      network.on("click", function (params) {
        if (params.nodes.length === 1 && params.nodes[0] === 1) {
          window.open('https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID', '_blank');
        }
      });
    }

    drawNetwork();
  </script>
</body>
</html>
