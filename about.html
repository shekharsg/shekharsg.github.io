<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About | Shekhar Sharan Goyal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }
    header {
      background: linear-gradient(to right, #005c88, #0077aa);
      color: white;
      padding: 3rem 2rem 2rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    nav {
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 1000px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    section {
      margin-bottom: 2.5rem;
    }
    h2 {
      color: #0077aa;
      border-bottom: 2px solid #0077aa;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    ul li {
      margin-bottom: 1rem;
      padding-left: 1.2rem;
      position: relative;
    }
    ul li::before {
      content: "\2022";
      position: absolute;
      left: 0;
      color: #0077aa;
    }
    #network {
      width: 100%;
      height: 700px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: white;
    }
    .download-cv {
      display: block;
      width: fit-content;
      margin: 2rem auto 0;
      padding: 0.75rem 1.5rem;
      background-color: #0077aa;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .download-cv:hover {
      background-color: #005c88;
    }
  </style>

  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
</head>

<body>
  <header>
    <h1>Dr. Shekhar Sharan Goyal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="publications.html">Publications</a>
      <a href="visualization.html">Visualization</a>
      <a href="science_outreach.html">Science Outreach</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main id="cv-content">
    <!-- Keep all your existing sections like Biography, Education, etc. -->

    <section>
      <h2>Collaborative Network</h2>
      <div id="network"></div>
    </section>

    <button class="download-cv" onclick="downloadCV()">Download Detailed CV (PDF)</button>
  </main>

  <footer>
    <p>&copy; 2025 Shekhar Sharan Goyal</p>
  </footer>

  <script>
    function drawNetwork() {
      const nodes = new vis.DataSet([
        { id: 1, label: "Shekhar Sharan Goyal", shape: "circle", color: { background: "#005c99", border: "#003366", highlight: { background: "#007acc", border: "#005c99" } }, font: { color: "#ffffff", size: 22, bold: true }, size: 30 },
        { id: 2, label: "Rohini Kumar" },
        { id: 3, label: "Raviraj Dave" },
        { id: 4, label: "Masooma Batool" },
        { id: 5, label: "Adrija Datta" },
        { id: 6, label: "Udit Bhatia" },
        { id: 7, label: "Christian Schmidt" },
        { id: 8, label: "Wim de Vries" },
        { id: 9, label: "Karsten Rinke" },
        { id: 10, label: "Divya Upadhyay" },
        { id: 11, label: "Subimal Ghosh" },
        { id: 12, label: "Shaonli" }
      ]);

      const edges = new vis.DataSet([
        { from: 1, to: 2 }, { from: 1, to: 3 }, { from: 1, to: 4 }, { from: 1, to: 5 },
        { from: 1, to: 6 }, { from: 1, to: 7 }, { from: 1, to: 8 }, { from: 1, to: 9 },
        { from: 1, to: 10 }, { from: 1, to: 11 }, { from: 1, to: 12 }, { from: 6, to: 11 }, { from: 10, to: 11 },
        { from: 2, to: 3 }, { from: 2, to: 6 }, { from: 3, to: 6 },
        { from: 4, to: 3 }, { from: 4, to: 8 }, { from: 5, to: 6 },
        { from: 7, to: 2 }, { from: 8, to: 2 }, { from: 9, to: 2 },
        { from: 10, to: 6 }, { from: 12, to: 6 }
      ]);

      const container = document.getElementById('network');
      const data = { nodes: nodes, edges: edges };
      const options = {
        layout: { randomSeed: 15, improvedLayout: true },
        nodes: {
          borderWidth: 1,
          shadow: { enabled: true, color: 'rgba(0,0,0,0.1)', size: 10, x: 5, y: 5 },
          scaling: { min: 10, max: 40 }
        },
        edges: {
          color: { color: "#cccccc", highlight: "#007acc", hover: "#007acc" },
          width: 2,
          smooth: { type: "dynamic" }
        },
        physics: {
          solver: "forceAtlas2Based",
          forceAtlas2Based: {
            gravitationalConstant: -50,
            centralGravity: 0.01,
            springLength: 150,
            springConstant: 0.05,
            damping: 0.4
          },
          stabilization: { iterations: 150 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          navigationButtons: true,
          keyboard: true
        }
      };

      const network = new vis.Network(container, data, options);

      network.on("click", function (params) {
        if (params.nodes.length === 1 && params.nodes[0] === 1) {
          window.open('https://scholar.google.com/citations?user=YOUR_SCHOLAR_ID', '_blank');
        }
      });
    }

    function downloadCV() {
      const element = document.getElementById('cv-content');
      const opt = {
        margin: 0.5,
        filename: 'Shekhar_Sharan_Goyal_CV.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    drawNetwork();
  </script>
</body>
</html>
